[[rules]]
name = "no-credential-file-reads"
description = "Reject credential reads and uninspected remote helpers before tool execution."
claude_events = ["PreToolUse"]
cursor_events = ["preToolUse", "beforeReadFile", "beforeTabFileRead", "beforeShellExecution"]
codex_events = ["PreToolUse"]
gemini_events = ["BeforeTool"]
copilot_events = ["PreToolUse", "preToolUse"]
field_paths = ["credential_read_targets"]
pattern = '''(?im)(?![^\r\n]*\.(?:j2|tmpl|template)$)(?:^<(?:uninspected-script|unresolved-read)>$|\$\{?[A-Z0-9_]*(?:PASSWORD|SECRET|TOKEN|CREDENTIAL)[A-Z0-9_]*_FILE\}?$|(?:^|[/\\])\.env(?:\.(?!(?:example|sample|template|tmpl|j2|dist)(?:$|[/\\]))[^/\\\r\n]+)?$|(?:^|[/\\])(?:run|var[/\\]run)[/\\]secrets[/\\]|(?:^|[/\\])\.?(?:credentials|secrets)(?:[/\\]|$)|(?:^|[/\\])[^/\\\r\n]*(?:1password|onepassword|op[ _.-]?export|app[ _.-]?store|asc[ _.-]?api|api[ _.-]?key|private[ _.-]?key|secret|credential|token|password|passwd|auth)[^/\\\r\n]*\.(?:json|p8|pem|key|pkcs8|p12|pfx)$|(?:^|[/\\])[^/\\\r\n]*\.(?:p8|pem|key|pkcs8|p12|pfx)$)'''
action = "block"
redact_diagnostics = true
diagnostic_format = "message_only"
violation_message = "Credential file reads and uninspected helper execution are blocked. Use the service's authenticated public operation."
