# Rules that block shell commands that print credentials. Each rule matches the
# executable command that the shell parser extracts. The same text inside a
# quoted string, a commit message, or a heredoc body does not match.
# A command condition accepts one argv0. Each program has a separate rule.
#
# Eleven rules use action = "block". no-secret-dump-ps-arguments and
# no-secret-dump-pgrep-arguments use action = "audit", which records a match
# without changing the provider response. Agents run those two forms for routine
# process checks.
#
# The first condition of each rule excludes a patch body. Codex sends the text
# of an apply_patch call in the command field, and the shell parser reads lines
# of that text as commands.
#
# Append these rules to the installed configuration, then run
# `agent-gate config check`.

[[rules]]
name = "no-secret-dump-make-database"
description = "Block make from printing its variable database, which includes exported environment values."
events = ["PreToolUse", "preToolUse", "beforeShellExecution", "BeforeTool"]
action = "block"
violation_message = "The make flags -p and --print-data-base print every variable, including exported environment values. Run make without them."
[[rules.conditions]]
kind = "regex"
field_paths = ["tool_input.command", "command"]
pattern = '(?s)\A(?!\*\*\* Begin Patch).'
[[rules.conditions]]
kind = "command"
argv0 = "make"
strip_env = true
strip_args = ["env", "time", "command"]
cwd_flags = ["-C"]
# A short flag group counts only when every letter is a make flag without a
# value and at most two letters stand on each side of the p. -Cp (directory p),
# -f p, and a test flag such as -skip inside a quoted variable stay allowed.
pattern = '(?:^|\s)(?:--print-data-base|-[bBdeiknqrRsStw]{0,2}p[bBdeiknqrRsStw]{0,2})(?:\s|$)'

[[rules]]
name = "no-secret-dump-env"
description = "Block env with no command, which prints the whole environment."
events = ["PreToolUse", "preToolUse", "beforeShellExecution", "BeforeTool"]
action = "block"
violation_message = "Running env without a command prints every environment value. Print one named variable with printenv NAME instead."
[[rules.conditions]]
kind = "regex"
field_paths = ["tool_input.command", "command"]
pattern = '(?s)\A(?!\*\*\* Begin Patch).'
[[rules.conditions]]
kind = "command"
argv0 = "env"
strip_env = true
# Only flags, flag values, and assignments follow env. Any other word is the
# command that env runs.
pattern = '^(?:(?:-[uCS]\s+\S+|-\S+|[A-Za-z_][A-Za-z0-9_]*=\S*)(?:\s+|$))*$'

# The shell parser reports the leading flag of `env -0` as the program. The
# command condition above does not match that form. This rule matches the start
# of a chained command segment in cmd_segments.
[[rules]]
name = "no-secret-dump-env-null"
description = "Block env -0 with no command, which prints the whole environment."
events = ["PreToolUse", "preToolUse", "beforeShellExecution", "BeforeTool"]
action = "block"
violation_message = "Running env -0 without a command prints every environment value. Print one named variable with printenv NAME instead."
[[rules.conditions]]
kind = "regex"
field_paths = ["tool_input.command", "command"]
pattern = '(?s)\A(?!\*\*\* Begin Patch).'
[[rules.conditions]]
kind = "regex"
field_paths = ["cmd_segments"]
pattern = '(?m)^\s*(?:\S*/)?env\s+(?:-0|--null)(?:\s+[A-Za-z_][A-Za-z0-9_]*=\S*)*(?:\s*\d*>{1,2}&?\s*\S+)*\s*(?:$|\|)'

[[rules]]
name = "no-secret-dump-printenv"
description = "Block printenv with no variable name, which prints the whole environment."
events = ["PreToolUse", "preToolUse", "beforeShellExecution", "BeforeTool"]
action = "block"
violation_message = "Running printenv without a variable name prints every environment value. Pass the variable name."
[[rules.conditions]]
kind = "regex"
field_paths = ["tool_input.command", "command"]
pattern = '(?s)\A(?!\*\*\* Begin Patch).'
[[rules.conditions]]
kind = "command"
argv0 = "printenv"
strip_env = true
strip_args = ["env", "time", "command"]
pattern = '^(?:-\S+(?:\s+|$))*$'

[[rules]]
name = "no-secret-dump-export"
description = "Block export and readonly with no names or with -p, which list variable values."
events = ["PreToolUse", "preToolUse", "beforeShellExecution", "BeforeTool"]
action = "block"
violation_message = "export and readonly with no names or with -p print every listed value. Print one named variable instead."
[[rules.conditions]]
kind = "regex"
field_paths = ["tool_input.command", "command"]
pattern = '(?s)\A(?!\*\*\* Begin Patch).'
# The shell parser reports export, declare, and typeset as declarations. A
# command condition matches parsed commands only. The export and declare rules
# match the start of a chained command segment in cmd_segments, which excludes
# heredoc bodies and comments. A pipe does not end a segment, and each pattern
# accepts output redirections and a pipe after the listing.
[[rules.conditions]]
kind = "regex"
field_paths = ["cmd_segments"]
pattern = '(?m)^\s*(?:export|readonly)(?:\s+-p)?(?:\s*\d*>{1,2}&?\s*\S+)*\s*(?:$|\|)'

[[rules]]
name = "no-secret-dump-declare"
description = "Block declare and typeset with no name, which list variable values."
events = ["PreToolUse", "preToolUse", "beforeShellExecution", "BeforeTool"]
action = "block"
violation_message = "declare and typeset with no variable name print every variable value. Pass the variable name."
[[rules.conditions]]
kind = "regex"
field_paths = ["tool_input.command", "command"]
pattern = '(?s)\A(?!\*\*\* Begin Patch).'
[[rules.conditions]]
kind = "regex"
field_paths = ["cmd_segments"]
pattern = '(?m)^\s*(?:declare|typeset)(?:\s+-[A-Za-z]*[xp][A-Za-z]*)*(?:\s*\d*>{1,2}&?\s*\S+)*\s*(?:$|\|)'

# A command condition does not inspect the script that a shell runs with -c.
# This rule matches a -c script in which a chained segment starts with a bare
# listing command.
[[rules]]
name = "no-secret-dump-shell-wrapper"
description = "Block bash -c, sh -c, and zsh -c scripts that run a bare environment or variable listing."
events = ["PreToolUse", "preToolUse", "beforeShellExecution", "BeforeTool"]
action = "block"
violation_message = "This shell -c script runs a command that prints every environment or shell variable value. Print one named variable with printenv NAME instead."
[[rules.conditions]]
kind = "regex"
field_paths = ["tool_input.command", "command"]
pattern = '(?s)\A(?!\*\*\* Begin Patch).'
[[rules.conditions]]
kind = "regex"
field_paths = ["cmd_segments"]
pattern = '''(?m)^\s*(?:sudo\s+)?(?:\S*/)?(?:bash|sh|zsh)\s+(?:-\S+\s+)*?-[A-Za-z]*c\s+['"]?(?:[^'"]*[;&|]\s*)?(?:(?:\S*/)?env(?:\s+(?:-0|--null))?(?:\s+[A-Za-z_][A-Za-z0-9_]*=[^\s'";&|]*)*|printenv|set|export(?:\s+-p)?|readonly(?:\s+-p)?|(?:declare|typeset)(?:\s+-[A-Za-z]*[xp][A-Za-z]*)*)(?:\s*\d*>{1,2}&?\s*[^\s'";&|]+)*\s*(?:['"]|[;&|]|$)'''

[[rules]]
name = "no-secret-dump-set"
description = "Block set with no arguments, which lists every shell variable."
events = ["PreToolUse", "preToolUse", "beforeShellExecution", "BeforeTool"]
action = "block"
violation_message = "set with no arguments prints every shell variable. Print one named variable instead."
[[rules.conditions]]
kind = "regex"
field_paths = ["tool_input.command", "command"]
pattern = '(?s)\A(?!\*\*\* Begin Patch).'
[[rules.conditions]]
kind = "command"
argv0 = "set"
strip_env = true
pattern = '^$'

[[rules]]
name = "no-secret-dump-ps-environment"
description = "Block ps listings that include process environments."
events = ["PreToolUse", "preToolUse", "beforeShellExecution", "BeforeTool"]
action = "block"
violation_message = "This ps form prints process environments, which can include credentials. Select columns without the environment, for example ps -o pid,comm."
[[rules.conditions]]
kind = "regex"
field_paths = ["tool_input.command", "command"]
pattern = '(?s)\A(?!\*\*\* Begin Patch).'
[[rules.conditions]]
kind = "command"
argv0 = "ps"
strip_env = true
strip_args = ["env", "time", "command", "sudo"]
# Alternatives: a BSD style first word with the e modifier (eww, auxe), an -E
# flag group, and an -o column list with the environment column.
pattern = '^[A-Za-z]*e[A-Za-z]*(?:\s|$)|(?:^|\s)-[A-Za-z]*E[A-Za-z]*(?:\s|$)|(?:^|\s)-[oO]\s*\S*\benvironment\b'

[[rules]]
name = "no-secret-dump-ps-arguments"
description = "Record ps listings that include full command lines."
events = ["PreToolUse", "preToolUse", "beforeShellExecution", "BeforeTool"]
action = "audit"
violation_message = "This ps form prints full command lines, which can include credentials. Select columns without arguments, for example ps -o pid,comm."
[[rules.conditions]]
kind = "regex"
field_paths = ["tool_input.command", "command"]
pattern = '(?s)\A(?!\*\*\* Begin Patch).'
[[rules.conditions]]
kind = "command"
argv0 = "ps"
strip_env = true
strip_args = ["env", "time", "command", "sudo"]
# Alternatives: a BSD style first word (aux), a full-format flag group (-ef),
# and an -o column list with an arguments column.
pattern = '^[A-Za-z]+(?:\s|$)|(?:^|\s)-[A-Za-z]*[fF][A-Za-z]*(?:\s|$)|(?:^|\s)-[oO]\s*\S*\b(?:args|command|cmd)\b'

[[rules]]
name = "no-secret-dump-pgrep-arguments"
description = "Record pgrep listings that print full command lines."
events = ["PreToolUse", "preToolUse", "beforeShellExecution", "BeforeTool"]
action = "audit"
violation_message = "pgrep with -a, --list-full, or -f together with -l prints full command lines, which can include credentials. Use pgrep -x name or pgrep -f pattern without a listing flag."
[[rules.conditions]]
kind = "regex"
field_paths = ["tool_input.command", "command"]
pattern = '(?s)\A(?!\*\*\* Begin Patch).'
[[rules.conditions]]
kind = "command"
argv0 = "pgrep"
strip_env = true
strip_args = ["env", "time", "command", "sudo"]
pattern = '(?:^|\s)(?:--list-full|-[A-Za-z]*a[A-Za-z]*)(?:\s|$)|^(?=.*(?:^|\s)-[A-Za-z]*f)(?=.*(?:^|\s)-[A-Za-z]*l)'

[[rules]]
name = "no-secret-dump-claude-mcp"
description = "Block claude mcp get and claude mcp list, which print configured server values."
events = ["PreToolUse", "preToolUse", "beforeShellExecution", "BeforeTool"]
action = "block"
violation_message = "claude mcp get and claude mcp list print configured server environment values, headers, and arguments. Read the server name from the MCP tool list instead."
[[rules.conditions]]
kind = "regex"
field_paths = ["tool_input.command", "command"]
pattern = '(?s)\A(?!\*\*\* Begin Patch).'
[[rules.conditions]]
kind = "command"
argv0 = "claude"
subcommands = ["mcp"]
strip_env = true
strip_args = ["env", "time", "command"]
pattern = '^mcp\s+(?:get|list)(?:\s|$)'
not_pattern = '(?:^|\s)(?:-h|--help)(?:\s|$)'

[[rules]]
name = "no-secret-dump-proc-environ"
description = "Block commands that read /proc/<pid>/environ or /proc/<pid>/cmdline, which store a process environment and its full command line."
events = ["PreToolUse", "preToolUse", "beforeShellExecution", "BeforeTool"]
action = "block"
violation_message = "Reading /proc/<pid>/environ or /proc/<pid>/cmdline prints the environment or full command line of a process, which can include credentials. Read one named variable from the owning service configuration instead."
[[rules.conditions]]
kind = "regex"
field_paths = ["tool_input.command", "command"]
pattern = '(?s)\A(?!\*\*\* Begin Patch).'
[[rules.conditions]]
kind = "regex"
field_paths = ["tool_input.command", "command"]
pattern = '/proc/(?:self|thread-self|\d+)/(?:environ|cmdline)'
# The read target must be the environ or cmdline file itself. A command that
# only mentions the path in a quoted string has no read target and stays allowed.
# The (^|=) prefix accepts the dd operand form if=/proc/<pid>/environ.
[[rules.conditions]]
kind = "exec"
command = [
    "/usr/bin/awk",
    'BEGIN { exit !(ARGV[1] ~ "(^|=)/proc/(self|thread-self|[0-9]+)/(environ|cmdline)$") }',
    "{{item}}",
]
for_each = "cmd_read_targets"
match_mode = "any"
cache_key = "cmd_read_targets"
cache_ttl_ms = 0
timeout_ms = 2000
retry_count = 0
block_on = "zero"
on_error = "closed"
[[rules.conditions.read_specs]]
name = "proc-environ-readers"
argv0 = [
    "cat", "tr", "strings", "head", "tail", "less", "more", "od", "xxd", "hexdump",
    "cut", "sort", "uniq", "wc", "nl", "grep", "egrep", "fgrep", "rg", "sed", "awk",
    "cp", "xargs", "dd",
]
path_arg_start = 1
